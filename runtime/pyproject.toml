[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "playlist-bridge"
version = "0.1.0"
description = "Playlist transfer tool between Spotify and YouTube"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Martin", email = "martin473@example.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "platformdirs>=4.0.0",
    "spotipy>=2.23.0",
    "google-api-python-client>=2.108.0",
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.1.0",
    "keyring>=24.0.0",
    "SQLAlchemy>=2.0.0",
    "alembic>=1.12.0",
    "rapidfuzz>=3.0.0",
    "tenacity>=8.0.0",
    "isodate>=0.6.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
]

[project.scripts]
playlist-bridge = "playlist_bridge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/playlist_bridge"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["playlist_bridge"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
follow_imports = "normal"
ignore_missing_imports = true
exclude = [
    "src/playlist_bridge/providers/errors.py",
    "src/playlist_bridge/domain/models.py",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "build>=1.0.0",
]
