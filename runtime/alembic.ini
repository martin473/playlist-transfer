# Alembic configuration file for playlist-bridge

[alembic]
# Path to the migration environment script
script_location = migrations

# Template used to generate new migration scripts
file_template = %%(rev)s_%%(slug)s

# Timezone to use for timestamps in migration files
# timezone = UTC

# sys.path path, will be prepended to sys.path if present.
prepend_sys_path = .

# Version path separator
# version_path_separator = ;

# Output encoding for migration files
# output_encoding = utf-8

# Database URL - will be provided at runtime by the application
# DO NOT set a static value here; the migration environment will read from
# the application configuration or use an in-memory SQLite URL for testing.
# sqlalchemy.url = sqlite:///playlist-bridge.db

[post_write_hooks]
# Post-write hooks for formatting migration scripts
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 100

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers = console
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
